spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/yut_review}
    username: ${DB_USERNAME:yut_review}
    password: ${DB_PASSWORD:local_only_change_me}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul
server:
  forward-headers-strategy: framework
management.endpoints.web.exposure.include: health
app:
  phone-hmac-key: ${PHONE_HMAC_SECRET}
  phone-encryption-key: ${PHONE_ENCRYPTION_KEY}
  jwt-key: ${JWT_SECRET}
  ai:
    # 기본은 fake다. 키 없이도 서비스가 뜨고 CI가 네트워크를 타지 않는다.
    provider: ${AI_PROVIDER:fake}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model:
      fast: ${AI_MODEL_FAST:gpt-4.1-mini}
      analysis: ${AI_MODEL_ANALYSIS:gpt-4.1}
      chat: ${AI_MODEL_CHAT:gpt-4.1-mini}
    # 토큰 단가(1M 토큰 기준 USD). 공급자 가격이 바뀌면 코드가 아니라 이 값을 고친다.
    pricing:
      input-per-million: ${AI_PRICE_INPUT_PER_MILLION:0}
      output-per-million: ${AI_PRICE_OUTPUT_PER_MILLION:0}
  # 운영자 콘솔(/api/system/**, 화면은 /admin/system). 기본값은 "켜져 있고 IP 제한 없음"이지만,
  # 비밀번호 + TOTP 2단계 인증은 어떤 설정에서도 빠지지 않는다.
  system-console:
    enabled: ${SYSTEM_CONSOLE_ENABLED:true}
    # 비어 있으면 IP로 막지 않는다. 쉼표로 구분한 IP 또는 CIDR(예: 203.0.113.4,10.0.0.0/8).
    # Cloudflare 터널 뒤에서는 모든 요청이 터널 IP로 보여 이 값이 사실상 무의미하다.
    allowed-ips: ${SYSTEM_CONSOLE_ALLOWED_IPS:}
    session-minutes: ${SYSTEM_CONSOLE_SESSION_MINUTES:60}
    issuer: ${SYSTEM_CONSOLE_ISSUER:윷리뷰 운영자}
    # 두 값이 모두 있고 그 이메일의 계정이 없을 때만 운영자 계정을 만든다. 기존 계정은 건드리지 않는다.
    operator-email: ${SYSTEM_ADMIN_EMAIL:}
    operator-password: ${SYSTEM_ADMIN_PASSWORD:}
  bootstrap:
    enabled: ${FIELD_TEST_BOOTSTRAP_ENABLED:false}
    email: ${FIELD_TEST_ADMIN_EMAIL:}
    password: ${FIELD_TEST_ADMIN_PASSWORD:}
    store-name: ${BOOTSTRAP_STORE_NAME:Yut Review Test Store}
    store-phone: ${BOOTSTRAP_STORE_PHONE:0200000000}
    naver-place-url: ${FIELD_TEST_NAVER_PLACE_URL:}
    staff-pin: ${FIELD_TEST_STAFF_PIN:}

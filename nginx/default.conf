# 운영자 로그인은 사람 한 명이 쓰는 문이다. 애플리케이션의 시도 제한 앞에 한 겹 더 둔다.
# 주의: Cloudflare 터널 뒤에서는 $binary_remote_addr이 터널 컨테이너 IP로 고정돼 매장 전체가
# 한 통에 들어간다. 현장 테스트 규모에서는 문제가 없지만 운영에서는 real_ip 설정이 필요하다.
limit_req_zone $binary_remote_addr zone=ops_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ops_gate:1m rate=60r/m;

server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;

    location /api/actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/system/auth/ {
        limit_req zone=ops_login burst=5 nodelay;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://backend:8080/api/system/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 꺼진 콘솔·허용 목록 밖 요청도 감사 로그에 남으므로, 인증 전 요청 폭주가 DB를 채우지 않게
    # 전체 콘솔 경로에 완만한 상한을 둔다. 로그인은 위의 더 엄격한 location이 우선한다.
    location /api/system/ {
        limit_req zone=ops_gate burst=20 nodelay;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://backend:8080/api/system/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

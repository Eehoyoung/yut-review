# 운영 ingress. docker-compose.prod.yml이 이 파일을 /etc/nginx/conf.d/default.conf 로 마운트한다.
#
# limit_req_zone은 http 컨텍스트 전용이라 server 블록 밖(= 이 파일 최상단)에 둔다.
# conf.d/*.conf 는 nginx.conf의 http 블록 안에서 include되므로 여기가 http 컨텍스트다.
#
# 왜: 백엔드 DB 카운터 quota가 authoritative한 정확한 제한이고, 아래 limit_req는 그 앞단 완충이다.
# 스프링 스레드/커넥션까지 도달하기 전에 명백한 폭주를 끊는 용도이며 정책 수치의 기준이 아니다.
limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
limit_req_status 429;

# 알 수 없는 Host로 오는 요청은 fail-closed. 어떤 응답도 주지 않고 커넥션을 끊는다(444).
# 왜: canonical origin이 아닌 Host로 접근한 요청이 field-test 시절처럼 우연히 서비스되지 않게 한다.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 80;
    server_name yut.sodamlabs.kr;
    return 308 https://yut.sodamlabs.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yut.sodamlabs.kr;

    # Cloudflare 신뢰 대역에서만 CF-Connecting-IP를 real_ip로 해석한다.
    # 그 결과 $remote_addr가 실제 클라이언트 IP가 되므로 아래 X-Real-IP/limit_req가 그대로 맞는다.
    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    # 운영 배포에서 인증서를 이 경로에 read-only mount한다.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 업로드 본문 상한. 이 서비스에 파일 업로드 API가 없으므로 1m이면 충분하다.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;

    location /api/actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host yut.sodamlabs.kr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host yut.sodamlabs.kr;
        proxy_set_header CF-Connecting-IP "";
    }

    location /api/ {
        # 앞단 완충. 정확한 한도는 백엔드가 센다.
        limit_req zone=public_api burst=40 nodelay;

        # add_header가 하나라도 있으면 상위 add_header를 상속하지 않으므로 보안 헤더를 함께 유지한다.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host yut.sodamlabs.kr;
        # $remote_addr는 real_ip 모듈이 복원한 실제 클라이언트 IP다. 클라이언트가 직접 보낸
        # X-Real-IP / X-Forwarded-For / CF-Connecting-IP는 여기서 전부 덮어써서 위조를 막는다.
        # XFF에 $proxy_add_x_forwarded_for를 쓰지 않는 이유도 같다(클라이언트가 앞부분을 심을 수 있다).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host yut.sodamlabs.kr;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host yut.sodamlabs.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host yut.sodamlabs.kr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

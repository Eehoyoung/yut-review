server {
    listen 80;
    server_name yut.sodamlabs.kr;
    return 308 https://yut.sodamlabs.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yut.sodamlabs.kr;

    # 운영 배포에서 인증서를 이 경로에 read-only mount한다.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;

    location /api/actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host yut.sodamlabs.kr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host yut.sodamlabs.kr;
    }

    location /api/ {
        # add_header가 하나라도 있으면 상위 add_header를 상속하지 않으므로 보안 헤더를 함께 유지한다.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host yut.sodamlabs.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host yut.sodamlabs.kr;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host yut.sodamlabs.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host yut.sodamlabs.kr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

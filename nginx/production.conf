# 운영 ingress. docker-compose.prod.yml이 이 파일을 /etc/nginx/conf.d/default.conf 로 마운트한다.
#
# limit_req_zone은 http 컨텍스트 전용이라 server 블록 밖(= 이 파일 최상단)에 둔다.
# conf.d/*.conf 는 nginx.conf의 http 블록 안에서 include되므로 여기가 http 컨텍스트다.
#
# 왜: 백엔드 DB 카운터 quota가 authoritative한 정확한 제한이고, 아래 limit_req는 그 앞단 완충이다.
# 스프링 스레드/커넥션까지 도달하기 전에 명백한 폭주를 끊는 용도이며 정책 수치의 기준이 아니다.
limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
limit_req_status 429;
server_tokens off;

# Cloudflare 장애 분석에 필요한 Ray ID를 모든 운영 접근 로그에 남긴다.
# 실제 고객 IP는 아래 real_ip 설정으로 $remote_addr에 복원된다.
log_format cf_main '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'cf_ray="$http_cf_ray" request_time=$request_time '
                   'upstream_time="$upstream_response_time"';
access_log /var/log/nginx/access.log cf_main;

# 알 수 없는 Host로 오는 요청은 fail-closed. 어떤 응답도 주지 않고 커넥션을 끊는다(444).
# 왜: canonical origin이 아닌 Host로 접근한 요청이 field-test 시절처럼 우연히 서비스되지 않게 한다.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 80;
    server_name hanpan.sodamlabs.kr;
    return 308 https://hanpan.sodamlabs.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hanpan.sodamlabs.kr;

    # Cloudflare 신뢰 대역에서만 CF-Connecting-IP를 real_ip로 해석한다.
    # 그 결과 $remote_addr가 실제 클라이언트 IP가 되므로 아래 X-Real-IP/limit_req가 그대로 맞는다.
    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    # 운영 배포에서 인증서를 이 경로에 read-only mount한다.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 업로드 본문 상한. 이 서비스에 파일 업로드 API가 없으므로 1m이면 충분하다.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 포트원 결제창: SDK(cdn.portone.io)가 checkout-service.prod.iamport.co iframe을 띄운다. PG 화면은 그 iframe 안이라 여기 적지 않는다.
    # Next.js 클라이언트 이동은 첫 문서의 CSP를 유지하므로 /admin에만 따로 걸 수 없다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.portone.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.iamport.co https://service.iamport.kr; frame-src https://*.iamport.co https://service.iamport.kr; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;

    # 외부에는 health만 연다. actuator는 prod에서 관리 포트 8081에만 있고, metrics는 운영 콘솔 collector가
    # 호스트 루프백(127.0.0.1:18080 -> 8081)으로만 읽는다.
    location /api/actuator/ {
        return 404;
    }

    location = /api/actuator/health {
        proxy_pass http://backend:8081/actuator/health;
        proxy_set_header Host hanpan.sodamlabs.kr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hanpan.sodamlabs.kr;
        proxy_set_header CF-Connecting-IP "";
    }

    location /api/ {
        # 앞단 완충. 정확한 한도는 백엔드가 센다.
        limit_req zone=public_api burst=40 nodelay;

        # add_header가 하나라도 있으면 상위 add_header를 상속하지 않으므로 보안 헤더를 함께 유지한다.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        # 색인 정책: 공개 페이지(/)는 검색 등록 대상이고 /admin, /s/는 Next 메타 robots로 noindex 한다.
        # API 응답만 헤더로 noindex 한다. robots.txt도 /api/를 막는다.
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host hanpan.sodamlabs.kr;
        # $remote_addr는 real_ip 모듈이 복원한 실제 클라이언트 IP다. 클라이언트가 직접 보낸
        # X-Real-IP / X-Forwarded-For / CF-Connecting-IP는 여기서 전부 덮어써서 위조를 막는다.
        # XFF에 $proxy_add_x_forwarded_for를 쓰지 않는 이유도 같다(클라이언트가 앞부분을 심을 수 있다).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hanpan.sodamlabs.kr;
    }

    # 빌드 해시가 파일명에 포함되므로 새 배포와 충돌하지 않는 immutable 자산이다.
    location ^~ /_next/static/ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        proxy_pass http://frontend:3000;
        proxy_set_header Host hanpan.sodamlabs.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hanpan.sodamlabs.kr;
    }

    # 공개 랜딩 이미지는 개인정보나 매장 상태를 포함하지 않는다.
    location ~ ^/(landing|brand)/ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        proxy_pass http://frontend:3000;
        proxy_set_header Host hanpan.sodamlabs.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hanpan.sodamlabs.kr;
    }

    # Next Image 결과는 URL 쿼리(width/quality/source)를 기본 캐시 키로 유지한다.
    location = /_next/image {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        proxy_pass http://frontend:3000;
        proxy_set_header Host hanpan.sodamlabs.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hanpan.sodamlabs.kr;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host hanpan.sodamlabs.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hanpan.sodamlabs.kr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 이전 공개 주소는 새 canonical origin으로만 보낸다. 인증서에는 두 호스트가 모두 포함되어야 한다.
server {
    listen 80;
    server_name yut.sodamlabs.kr;
    return 308 https://hanpan.sodamlabs.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yut.sodamlabs.kr;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://hanpan.sodamlabs.kr$request_uri;
}

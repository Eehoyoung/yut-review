services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-yut_review}
      POSTGRES_USER: ${DB_USERNAME:-yut}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-yut-password}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-field-test}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-yut_review}
      DB_USERNAME: ${DB_USERNAME:-yut}
      DB_PASSWORD: ${DB_PASSWORD:-local-yut-password}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in env file}
      PHONE_HMAC_SECRET: ${PHONE_HMAC_SECRET:?set PHONE_HMAC_SECRET in env file}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?set PHONE_ENCRYPTION_KEY in env file}
      FIELD_TEST_BOOTSTRAP_ENABLED: ${FIELD_TEST_BOOTSTRAP_ENABLED:-true}
      # 첫 운영자 1회 주입. 비워 두면 아무 일도 하지 않는다.
      OPERATOR_BOOTSTRAP_EMAIL: ${OPERATOR_BOOTSTRAP_EMAIL:-}
      OPERATOR_BOOTSTRAP_PASSWORD: ${OPERATOR_BOOTSTRAP_PASSWORD:-}
      # 국세청 사업자등록 진위확인. 키는 .env에만 두고 로그에 찍지 않는다.
      BUSINESS_VERIFICATION_ENABLED: ${BUSINESS_VERIFICATION_ENABLED:-false}
      NTS_SERVICE_KEY: ${NTS_SERVICE_KEY:-}
      # 매장 승인제. false면 가입 즉시 ACTIVE. 중복 사업자번호는 이 값과 무관하게 막힌다.
      STORE_APPROVAL_REQUIRED: ${STORE_APPROVAL_REQUIRED:-false}
      # 운영자 콘솔 접근 통제. false가 유일한 잠금 탈출구라 지우지 말 것.
      OPERATOR_ACCESS_ENABLED: ${OPERATOR_ACCESS_ENABLED:-false}
      OPERATOR_ALLOWED_CIDRS: ${OPERATOR_ALLOWED_CIDRS:-}
      OPERATOR_RP_ID: ${OPERATOR_RP_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      FIELD_TEST_ADMIN_EMAIL: ${FIELD_TEST_ADMIN_EMAIL:-}
      FIELD_TEST_ADMIN_PASSWORD: ${FIELD_TEST_ADMIN_PASSWORD:-}
      FIELD_TEST_STAFF_PIN: ${FIELD_TEST_STAFF_PIN:-}
      FIELD_TEST_NAVER_PLACE_URL: ${FIELD_TEST_NAVER_PLACE_URL:-https://map.naver.com/}
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      INTERNAL_API_BASE: http://backend:8080
      NEXT_PUBLIC_LEGAL_BUSINESS_NAME: ${LEGAL_BUSINESS_NAME:-소담한판 운영자}
      NEXT_PUBLIC_LEGAL_REPRESENTATIVE: ${LEGAL_REPRESENTATIVE:-사업자등록 완료 후 공개}
      NEXT_PUBLIC_LEGAL_BUSINESS_NUMBER: ${LEGAL_BUSINESS_NUMBER:-사업자등록 완료 후 공개}
      NEXT_PUBLIC_LEGAL_ADDRESS: ${LEGAL_ADDRESS:-사업자등록 완료 후 공개}
      NEXT_PUBLIC_LEGAL_EMAIL: ${LEGAL_EMAIL:-사업자등록 완료 후 공개}
      NEXT_PUBLIC_LEGAL_PHONE: ${LEGAL_PHONE:-사업자등록 완료 후 공개}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["field-test"]
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  postgres-data:
